<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Intelligence Dashboard - SafeRecruit AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 24px;
            width: 100%;
            margin-top: 32px;
        }
        .stats-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            width: 100%;
        }
        .stat-card {
            background: var(--surface);
            border: 1px solid var(--line);
            padding: 24px;
            border-radius: var(--radius);
            text-align: center;
        }
        .stat-value {
            display: block;
            font-size: 2.4rem;
            font-weight: 700;
            color: var(--accent);
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--ink-soft);
            font-weight: 600;
        }
        .chart-card {
            background: var(--surface);
            border: 1px solid var(--line);
            padding: 24px;
            border-radius: var(--radius);
            min-height: 350px;
            display: flex;
            flex-direction: column;
        }
        .chart-card h3 {
            margin: 0 0 20px;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        canvas {
            max-width: 100%;
            flex-grow: 1;
        }
    </style>
</head>
<body class="history-page">
    <canvas id="particleCanvas" aria-hidden="true"></canvas>

    <div class="profile-wrapper">
        <button type="button" class="profile-box" onclick="location.href='/logout'">
            <span class="avatar">{{ current_user.username[0]|upper }}</span>
            <span class="profile-info">
                <span class="username">Logout</span>
            </span>
        </button>
    </div>

    <main class="container">
        <section class="header-section">
            <div class="header-copy">
                <p class="eyebrow">Forensic Analytics</p>
                <h1 id="dashboard-title">Intelligence Dashboard</h1>
                <p class="guide">Real-time visualization of job fraud patterns and detection metrics.</p>
            </div>
        </section>

        <div class="stats-summary">
            <div class="stat-card">
                <span class="stat-value">{{ stats.total_scans }}</span>
                <span class="stat-label">Total Scans</span>
            </div>
            <div class="stat-card">
                <span class="stat-value">{{ stats.avg_risk }}%</span>
                <span class="stat-label">Avg Risk Score</span>
            </div>
            <div class="stat-card">
                <span class="stat-value">{{ stats.avg_confidence }}%</span>
                <span class="stat-label">Avg Confidence</span>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- Risk Distribution -->
            <div class="chart-card">
                <h3><span aria-hidden="true">&#128680;</span> Risk Breakdown</h3>
                <canvas id="riskChart"></canvas>
            </div>

            <!-- Activity Timeline -->
            <div class="chart-card">
                <h3><span aria-hidden="true">&#128200;</span> Activity (Last 7 Days)</h3>
                <canvas id="activityChart"></canvas>
            </div>

            <!-- Engine Distribution -->
            <div class="chart-card">
                <h3><span aria-hidden="true">&#129302;</span> Detection Engines</h3>
                <canvas id="engineChart"></canvas>
            </div>
        </div>

        <div class="action-buttons" style="margin-top: 48px;">
            <button type="button" onclick="location.href='/'" class="btn-secondary">
                <span aria-hidden="true">&larr;</span>
                <span>Back to Analysis</span>
            </button>
            <button type="button" onclick="location.href='/history'" class="btn-secondary">
                <span aria-hidden="true">&#128203;</span>
                <span>View Full History</span>
            </button>
        </div>
    </main>

    <script>
        // Chart.js Default Config for Dark Theme
        Chart.defaults.color = '#b3b8c2';
        Chart.defaults.borderColor = 'rgba(255, 255, 255, 0.1)';
        Chart.defaults.font.family = "'Outfit', sans-serif";

        const stats = {{ stats|tojson }};

        // 1. Risk Chart
        new Chart(document.getElementById('riskChart'), {
            type: 'pie',
            data: {
                labels: Object.keys(stats.risk_counts),
                datasets: [{
                    data: Object.values(stats.risk_counts),
                    backgroundColor: ['#ef4444', '#f59e0b', '#10a37f'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });

        // 2. Activity Chart
        new Chart(document.getElementById('activityChart'), {
            type: 'line',
            data: {
                labels: Object.keys(stats.timeline_data),
                datasets: [{
                    label: 'Scans',
                    data: Object.values(stats.timeline_data),
                    borderColor: '#10a37f',
                    backgroundColor: 'rgba(16, 163, 127, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                scales: {
                    y: { beginAtZero: true, ticks: { stepSize: 1 } }
                }
            }
        });

        // 3. Engine Chart
        new Chart(document.getElementById('engineChart'), {
            type: 'doughnut',
            data: {
                labels: Object.keys(stats.engine_counts),
                datasets: [{
                    data: Object.values(stats.engine_counts),
                    backgroundColor: ['#10a37f', '#444654'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom' }
                },
                cutout: '70%'
            }
        });
    </script>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
