<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SafeRecruit AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css', v='11') }}">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>

<body class="auth-page">

    <!-- 3D Wave Background -->
    <canvas id="waveCanvas"></canvas>

    <main class="login-wrapper">

        <section class="login-card">

            <h1 class="login-title">SafeRecruit AI</h1>

            {% if error %}
            <div class="error-box">⚠️ {{ error }}</div>
            {% endif %}

            <form method="POST" id="loginForm">

                <!-- Username -->
                <div class="field-group">
                    <div class="input-icon-wrap">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg"
                             width="18" height="18" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                            <circle cx="12" cy="7" r="4"/>
                        </svg>
                        <input
                            type="text"
                            name="username"
                            placeholder="Username"
                            required
                        >
                    </div>
                </div>

                <!-- Password -->
                <div class="field-group">
                    <div class="input-icon-wrap">
                        <svg class="input-icon" xmlns="http://www.w3.org/2000/svg"
                             width="18" height="18" viewBox="0 0 24 24"
                             fill="none" stroke="currentColor"
                             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                        </svg>
                        <input
                            type="password"
                            name="password"
                            placeholder="Password"
                            required
                        >
                    </div>
                </div>

                <button type="submit" class="btn-login">
                    SIGN IN →
                </button>

            </form>

            <p class="login-note">
                Don't have an account? <a href="/signup">Sign up</a>
            </p>

        </section>

    </main>

    <script src="{{ url_for('static', filename='script.js', v='11') }}"></script>

</body>
</html>
