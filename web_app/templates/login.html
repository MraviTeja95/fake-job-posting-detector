<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login – SafeRecruit AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body {
            padding-top: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .login-wrapper {
            width: 100%;
            max-width: 420px;
            padding: 20px;
            animation: fadeUp 0.45s ease both;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        .login-card {
            background: rgba(255,255,255,0.97);
            backdrop-filter: blur(30px);
            border-radius: 24px;
            padding: 44px 40px 36px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
            border: 1px solid rgba(255,255,255,0.8);
        }

        .login-logo  { text-align:center; font-size:2.6em; margin-bottom:6px; }
        .login-title { text-align:center; font-size:1.5em; font-weight:700; color:#1a1a1a; margin-bottom:4px; }
        .login-sub   { text-align:center; font-size:13px; color:#999; margin-bottom:32px; }

        .field-label {
            display: block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: #666;
            margin-bottom: 6px;
        }

        .field-group { margin-bottom: 18px; }
        .field-group input { margin: 0; }

        .btn-login {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #1a1a1a, #3a3a3a);
            color: white;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 6px;
            letter-spacing: 0.3px;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.22);
        }

        .btn-login:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
        }

        .login-note {
            text-align: center;
            font-size: 12px;
            color: #bbb;
            margin-top: 22px;
            line-height: 1.6;
        }

        /* override global error-box for login page */
        .error-box {
            font-size: 13px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <canvas id="particleCanvas"></canvas>

    <div class="login-wrapper">
        <div class="login-card">

            <div class="login-logo">🛡️</div>
            <h1 class="login-title">SafeRecruit AI</h1>
            <p class="login-sub">Sign in to detect fake job postings</p>

            {% if error %}
            <div class="error-box">⚠️ {{ error }}</div>
            {% endif %}

            <form method="POST" id="loginForm">
                <div class="field-group">
                    <label class="field-label" for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        autofocus
                        required
                    >
                </div>

                <div class="field-group">
                    <label class="field-label" for="password">Password</label>
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                    >
                </div>

                <button type="submit" class="btn-login" id="loginBtn">
                    Sign In →
                </button>
            </form>

            <p class="login-note">
                Enter any username to get started.<br>
                Your session is private and secure.
            </p>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function () {
            const btn = document.getElementById('loginBtn');
            btn.textContent = 'Signing in…';
            btn.disabled = true;
        });
    </script>
</body>
</html>
