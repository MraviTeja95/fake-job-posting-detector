<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SafeRecruit AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <canvas id="particleCanvas" aria-hidden="true"></canvas>

    <div class="profile-wrapper">
    </div>

    <main class="login-wrapper">
        <section class="login-card" aria-labelledby="login-title">
            <h1 class="login-title" id="login-title">SafeRecruit AI</h1>

            {% if error %}
            <div class="error-box" role="alert">&#9888;&#65039; {{ error }}</div>
            {% endif %}

            <form method="POST" id="loginForm">
                <div class="field-group">
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        autofocus
                        required
                    >
                </div>

                <div class="field-group">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >
                </div>

                <button type="submit" class="btn-login" id="loginBtn" data-loading-text="Signing in...">
                    <span>Sign In</span>
                    <span aria-hidden="true">&rarr;</span>
                </button>
            </form>

            <p class="login-note">
                Don't have an account?
                <a href="/signup" class="auth-link">Sign up here</a>
            </p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
