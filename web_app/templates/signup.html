<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - SafeRecruit AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <canvas id="particleCanvas" aria-hidden="true"></canvas>

    <div class="profile-wrapper">
        <select id="themeSelector" class="theme-selector" aria-label="Select theme">
            <option value="light">Classic Light</option>
            <option value="dark">Midnight Dark</option>
            <option value="cyberpunk">Cyberpunk</option>
            <option value="ocean">Ocean Blue</option>
            <option value="hacker">Hacker Terminal</option>
            <option value="solarized">Solarized Warm</option>
            <option value="nothing">Nothing Theme</option>
            <option value="glass">Glass UI</option>
            <option value="chatgpt">ChatGPT Style</option>
        </select>
    </div>

    <main class="login-wrapper">
        <section class="login-card" aria-labelledby="signup-title">
            <div class="brand-mark login-logo" aria-hidden="true">&#128737;</div>
            <h1 class="login-title" id="signup-title">SafeRecruit AI</h1>

            {% if error %}
            <div class="error-box" role="alert">&#9888;&#65039; {{ error }}</div>
            {% endif %}

            {% if success %}
            <div class="success-box" role="status">&#10003; {{ success }}</div>
            {% endif %}

            <form method="POST" id="signupForm">
                <div class="field-group">
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username (3+ characters)"
                        autocomplete="username"
                        autofocus
                        required
                    >
                </div>

                <div class="field-group">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password (6+ characters)"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="field-group">
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="btn-login" id="signupBtn" data-loading-text="Creating account...">
                    <span>Create Account</span>
                    <span aria-hidden="true">&rarr;</span>
                </button>
            </form>

            <p class="login-note">
                Already have an account?
                <a href="/login" class="auth-link">Login here</a><br>
                Your data is secure and private.
            </p>
        </section>
    </main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
